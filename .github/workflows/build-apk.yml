name: Build Android APK
 
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build variant to produce (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - both
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # بازسازی فایل .env از secrets یا fallback به .env.example
      - name: Write .env from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          DRIVER_API_KEY: ${{ secrets.DRIVER_API_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL=$SUPABASE_URL" > .env
          fi
          if [ -n "$DRIVER_API_KEY" ]; then
            echo "DRIVER_API_KEY=$DRIVER_API_KEY" >> .env
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi

      # بازسازی یا ساخت debug.keystore
      - name: Prepare debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      # اگر secret کیستور اختصاصی Release ست شده بود، آن را بازسازی کن
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          fi

      - name: Build APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi

          echo "Selected build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then
            gradle assembleDebug --no-daemon
          elif [ "$BUILD_TYPE" = "both" ]; then
            gradle assembleRelease assembleDebug --no-daemon
          else
            gradle assembleRelease --no-daemon
          fi

      - name: Clean up sensitive files
        if: always()
        run: rm -f my-upload-key.jks debug.keystore .env

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: carpet-driver-apk
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
